<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACC x AOE 貓咪情緒盲盒抽卡引擎</title>
    <style>
        :root {
            --theme-primary: #ff598f;
            --theme-light: #ff85a1;
            --theme-glow: rgba(255, 89, 143, 0.25);
            --theme-shadow: rgba(255, 89, 143, 0.6);
        }
        * { box-sizing: border-box; }
        body {
            background-color: #020205;
            color: #f3f4f6;
            font-family: "Courier New", Courier, monospace, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(var(--theme-glow) 1px, transparent 0);
            background-size: 25px 25px;
            z-index: -1;
            transition: background-image 0.5s ease;
        }
        .engine-container {
            background: rgba(8, 8, 15, 0.96);
            border: 2px solid var(--theme-primary);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 50px var(--theme-glow), inset 0 0 25px var(--theme-glow);
            max-width: 760px;
            width: 92%;
            backdrop-filter: blur(15px);
            position: relative;
            transition: all 0.4s ease;
            text-align: center;
        }
        .engine-container::after {
            content: "EMOTIONAL_CAT_BLINDBOX_v60";
            position: absolute;
            top: -12px;
            right: 20px;
            background: var(--theme-primary);
            color: #fff;
            font-size: 10px;
            padding: 2px 8px;
            letter-spacing: 2px;
            font-weight: bold;
        }
        .engine-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 12px;
            color: var(--theme-light);
            letter-spacing: 2px;
            font-weight: bold;
        }
        /* 四張貓咪背面盲盒牆 */
        .blindbox-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        .box-card {
            background: rgba(15, 15, 25, 0.9);
            border: 2px dashed var(--theme-primary);
            padding: 25px 15px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px var(--theme-glow);
        }
        .box-card:hover {
            background: var(--theme-primary);
            color: #fff;
            transform: translateY(-4px);
            box-shadow: 0 0 20px var(--theme-shadow);
            border-style: solid;
        }
        .box-title {
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }
        .box-sub {
            font-size: 11px;
            opacity: 0.8;
            letter-spacing: 1px;
        }
        /* 結果展示螢幕 */
        .result-screen {
            background: rgba(2, 2, 5, 0.85);
            border: 2px solid var(--theme-primary);
            padding: 25px;
            border-radius: 6px;
            margin-bottom: 20px;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 15px var(--theme-glow);
            white-space: pre-line;
        }
        .card-faction {
            font-size: 11px;
            letter-spacing: 3px;
            color: var(--theme-light);
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .card-title {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 12px;
            text-shadow: 0 0 10px var(--theme-primary);
        }
        .card-desc {
            font-size: 13px;
            line-height: 1.7;
            color: #d1d5db;
            max-width: 600px;
        }
        .reset-btn {
            background-color: #05050a;
            border: 2px solid var(--theme-primary);
            color: var(--theme-light);
            padding: 12px 25px;
            font-size: 13px;
            font-family: inherit;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 0 15px var(--theme-glow);
            transition: all 0.2s ease;
            letter-spacing: 2px;
            display: none;
        }
        .reset-btn:hover {
            background-color: var(--theme-primary);
            color: #fff;
            box-shadow: 0 0 25px var(--theme-shadow);
        }
        .status-badge {
            background: var(--theme-glow);
            padding: 4px 10px;
            border-radius: 3px;
            font-size: 11px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="engine-container">
    <div class="engine-header">
        <span id="engineStage">// 模式 : 貓咪情緒盲盒</span>
        <span class="status-badge" id="engineTimer">⚡ 點擊背面，領取情緒價值</span>
    </div>

    <div style="font-size: 22px; font-weight: 900; letter-spacing: 4px; margin-bottom: 12px; text-shadow: 0 0 10px var(--theme-primary);">
        ACC x AOE 貓咪情緒盲盒抽卡牆
    </div>

    <!-- 抽獎結果顯示區 -->
    <div class="result-screen" id="resultScreen">
        <div class="card-faction" id="cardFaction">SYSTEM READY</div>
        <div class="card-title" id="cardTitle">請憑直覺點選下方任一貓咪盲盒背面</div>
        <div class="card-desc" id="cardDesc">不管你現在心情怎樣、卡在什麼鳥事上，抽下去，讓貓咪們給你最強的同理與心靈爆擊！</div>
    </div>

    <!-- 貓咪背面盲盒按鈕牆 -->
    <div class="blindbox-grid" id="blindboxGrid">
        <div class="box-card" onclick="drawBlindBox('dinocat')">
            <div class="box-title">🔥 恐龍貓背影</div>
            <div class="box-sub">DinoCat 盲盒</div>
        </div>
        <div class="box-card" onclick="drawBlindBox('devil')">
            <div class="box-title">⚡ 小惡魔貓背影</div>
            <div class="box-sub">Little Devil Cat 盲盒</div>
        </div>
        <div class="box-card" onclick="drawBlindBox('magic')">
            <div class="box-title">🔮 魔法學院貓娘背影</div>
            <div class="box-sub">Cat Girl 盲盒</div>
        </div>
        <div class="box-card" onclick="drawBlindBox('sakura')">
            <div class="box-title">🌸 櫻花貓背影</div>
            <div class="box-sub">Sakura Cat 盲盒</div>
        </div>
    </div>

    <button class="reset-btn" id="resetBtn" onclick="resetEngine()">🔄 再抽一次盲盒</button>
</div>

    const themes = {
        dinocat: { primary: "#e63946", light: "#ff6b6b", glow: "rgba(230, 57, 70, 0.3)", shadow: "rgba(230, 57, 70, 0.7)" },
        devil: { primary: "#7209b7", light: "#b5179e", glow: "rgba(114, 9, 183, 0.3)", shadow: "rgba(114, 9, 183, 0.7)" },
        magic: { primary: "#3a86ff", light: "#48cae4", glow: "rgba(58, 134, 255, 0.3)", shadow: "rgba(58, 134, 255, 0.7)" },
        sakura: { primary: "#ff598f", light: "#ff85a1", glow: "rgba(255, 89, 143, 0.3)", shadow: "rgba(255, 89, 143, 0.7)" }
    };

    function setTheme(key) {
        let t = themes[key] || themes.sakura;
        let root = document.documentElement;
        root.style.setProperty('--theme-primary', t.primary);
        root.style.setProperty('--theme-light', t.light);
        root.style.setProperty('--theme-glow', t.glow);
        root.style.setProperty('--theme-shadow', t.shadow);
    }

    function drawBlindBox(category) {
        let list = deck[category];
        let randomCard = list[Math.floor(Math.random() * list.length)];
        
        setTheme(randomCard.theme);

        // 更新畫面，給滿情緒價值
        document.getElementById('cardFaction').textContent = "【盲盒開箱解鎖】 " + randomCard.faction;
        document.getElementById('cardTitle').textContent = "✨ " + randomCard.title;
        document.getElementById('cardDesc').textContent = randomCard.desc + "\n\n💖 【貓咪悄悄話】：把這張牌帶在心裡，今天不管發生什麼事，你都是最棒的！";

        // 隱藏盲盒牆，顯示重置按鈕
        document.getElementById('blindboxGrid').style.display = 'none';
        document.getElementById('resetBtn').style.display = 'inline-block';
        document.getElementById('engineTimer').textContent = "🎯 情緒價值已拉滿！";
    }

    function resetEngine() {
        setTheme('sakura');
        document.getElementById('cardFaction').textContent = "SYSTEM READY";
        document.getElementById('cardTitle').textContent = "請憑直覺點選下方任一貓咪盲盒背面";
        document.getElementById('cardDesc').textContent = "不管你現在心情怎樣、卡在什麼鳥事上，抽下去，讓貓咪們給你最強的同理與心靈爆擊！";
        
        document.getElementById('blindboxGrid').style.display = 'grid';
        document.getElementById('resetBtn').style.display = 'none';
        document.getElementById('engineTimer').textContent = "⚡ 點擊背面，領取情緒價值";
    }
